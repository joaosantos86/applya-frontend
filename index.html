<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- Aplica o tema salvo antes da primeira pintura (evita flash do tema
         errado). Chave em sincronia com THEME_STORAGE_KEY (useTheme.ts). -->
    <script>
      try {
        var theme = localStorage.getItem('applya-theme')
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme
      } catch (e) {}
    </script>
    <!-- Tokens de verificação/redefinição trafegam por query string: não
         permitir que vazem via cabeçalho Referer. Pode ser reforçado pelo
         header Referrer-Policy na hospedagem. -->
    <meta name="referrer" content="no-referrer" />
    <meta
      name="description"
      content="Applya — crie, personalize e gerencie seus currículos para cada oportunidade."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap"
      rel="stylesheet"
    />
    <title>Applya — Currículos feitos para você</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
